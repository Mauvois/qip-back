when:
  - branch: staging
    event: [push, manual]

steps:
  build-test:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --label org.opencontainers.image.revision="$CI_COMMIT_SHA" -t "qip_api_prod_api:$CI_COMMIT_SHA" .
      - sh ci/test.sh

  deploy:
    image: docker:29-cli
    depends_on: [build-test]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/serveur/projets/qip/qip-back/.env.prod:/run/qip.env:ro
      - /Users/serveur/docker/qip/ci-state:/ci-state
    commands:
      - apk add --no-cache curl util-linux
      - flock -w 900 /ci-state/deploy.lock sh ci/deploy.sh
